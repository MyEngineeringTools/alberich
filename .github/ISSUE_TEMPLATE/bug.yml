name: Bug
description: Functional defect in the published apps or docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** file a security vulnerability here. Email the address in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / revision
    validations:
      required: true
