name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  selftests:
    name: Repository acceptance (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Core regression
        run: bash scripts/test.sh
      - name: Research smoke
        run: bash scripts/reproduce-research.sh --smoke
      - name: Repository hygiene
        run: bash scripts/test-repository.sh
      - name: Extension packaging
        run: bash scripts/test-packaging.sh
      - name: Golden vector generator
        run: node reference/generate-vectors.mjs && python3 reference/alberich_reference.py --vectors reference/golden-vectors.json
