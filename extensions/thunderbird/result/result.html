<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alberich — Klartext</title>
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">A</span>
        <div>
          <h1 data-i18n="result.title">Entschlüsselter Klartext</h1>
          <p class="sub" id="metaLine"></p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-secondary" id="btnCopy" data-i18n="result.copy">
          Kopieren
        </button>
      </div>
    </header>

    <p class="note" data-i18n="result.note">
      Die Original-Mail bleibt unverändert (nur lesend). Dieser Tab ist lokal in der Extension.
    </p>

    <pre id="plainOut" class="plain-out" aria-live="polite"></pre>

    <p class="hint" id="hint" hidden></p>
    <p class="toast" id="toast" hidden></p>

    <script type="module" src="result.js"></script>
  </body>
</html>
